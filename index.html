<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Literacy Adventure Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <button id="mobile-menu-btn" onclick="toggleSidebar()">☰</button>

    <aside id="sidebar">
        <div class="sidebar-header">
            <h2 id="hub-home-link" onclick="goHome()"><span>🌟</span> Literacy Hub</h2>
            <p>Learning Journey</p>
        </div>
        <div class="sidebar-scroll" id="sidebar-content"></div>
    </aside>

    <main id="main-stage">
        <canvas id="vfx-canvas"></canvas>
        
        <header id="game-header">
            <div>
                <p id="active-category" style="color: var(--primary-blue); font-size: 0.75rem; font-weight: 800; text-transform: uppercase;">Main Lobby</p>
                <h3 id="active-title">Welcome, Explorer!</h3>
            </div>
            <div id="game-toolbar"></div>
        </header>

        <section id="game-container">
            <div id="loader" class="loader-overlay">
                <div class="spinner"></div>
                <p style="margin-top:15px; font-weight: 600; color: var(--text-muted)">Loading activity...</p>
            </div>

            <!-- Enhanced Success Overlay -->
            <div id="game-result-overlay" class="game-overlay">
                <div style="font-size: 80px; margin-bottom: 10px;">🏆</div>
                <h1 id="result-title" style="font-size: 2.5rem; color: var(--text-dark);">Great Job!</h1>
                <p id="result-message" style="font-size: 1.1rem; color: var(--text-muted); max-width: 400px;">You've completed the activity successfully.</p>
                
                <div class="btn-group">
                    <button class="game-btn secondary" onclick="retryGame()">
                        <span>🔄</span> Retry
                    </button>
                    <button class="game-btn success" id="next-game-btn" onclick="loadNextGame()">
                        Next Game <span>➡️</span>
                    </button>
                    <button class="game-btn" onclick="goHome()">
                        <span>🏠</span> Home
                    </button>
                </div>
            </div>
            
            <div id="game-stage">
                <!-- Lobby content is built dynamically by renderLobby() -->
            </div>
        </section>
    </main>

    <script>
        const gameData = [
            {
                category: "Reading Skills",
                folder: "reading",
                dimensions: [
                    { name: "Pre-reading Readiness", folder: "readiness", games: ["Distinguishing images", "Similar images", "visual association", "Missing parts", "Relationships"] },
                    { name: "Letters & Recognition", folder: "recognition", games: ["Letter shape", "Letter order", "Word shape", "Pronunciation", "Similar sounds"] },
                    { name: "Phonological Awareness", folder: "phonological", games: ["Vowels", "Syllables", "Silent letters", "Unwritten sounds", "Sound arrangement"] },
                    { name: "Basic Comprehension", folder: "basic_comp", games: ["Wh-questions", "Main idea", "Sub-ideas", "Sequencing", "Scrambled words"] },
                    { name: "Critical Comprehension", folder: "critical_comp", games: ["Fact/Opinion", "Reality/Fantasy", "Belonging phrases", "True/False", "Title/Ending"] }
                ]
            },
            {
                category: "Writing Skills",
                folder: "writing",
                dimensions: [
                    { name: "Pre-writing Readiness", folder: "readiness", games: ["location-position", "Connecting dots", "Geo shapes", "Colors", "Distances"] },
                    { name: "Letter & Word Formation", folder: "formation", games: ["Position writing", "Connect Detach", "Similar shapes", "Visual closeness", "Image to word"] },
                    { name: "Spelling & Mechanics", folder: "spelling", games: ["Vowel spelling", "Patterns", "Diacritics", "Punctuation", "Homophones"] },
                    { name: "Sentence Construction", folder: "sentences", games: ["Word arrangement", "Descriptive words", "Image description", "Paragraphs", "Formulating questions"] },
                    { name: "Written Expression", folder: "expression", games: ["About self", "Daily routine", "Short story", "Invitation", "Daily phrases"] }
                ]
            }
        ];

        // Icons shown on the lobby cards, keyed by dimension name
        const dimIcons = {
            "Pre-reading Readiness": "👁️",
            "Letters & Recognition": "🔤",
            "Phonological Awareness": "🔊",
            "Basic Comprehension": "📖",
            "Critical Comprehension": "🧠",
            "Pre-writing Readiness": "✏️",
            "Letter & Word Formation": "🖊️",
            "Spelling & Mechanics": "🔡",
            "Sentence Construction": "📝",
            "Written Expression": "📄"
        };
        const catIcons = { reading: "📚", writing: "✍️" };

        // Key used to remember where the user was standing, so an accidental
        // refresh brings them back to the same activity instead of the lobby.
        const LAST_GAME_KEY = "literacyHub_lastGameId";

        // Track flat list for "Next Game" logic
        let flatGameList = [];
        let currentActiveId = null;

        // --- GAME UTILITIES ---
        const GameUtils = {
            makeDraggable(element, onDropCallback) {
                let active = false, xOffset = 0, yOffset = 0, initialX, initialY;
                element.resetPosition = () => { xOffset = 0; yOffset = 0; element.style.transform = `translate3d(0, 0, 0)`; };
                const dragStart = (e) => {
                    const clientX = e.type === "touchstart" ? e.touches[0].clientX : e.clientX;
                    const clientY = e.type === "touchstart" ? e.touches[0].clientY : e.clientY;
                    initialX = clientX - xOffset; initialY = clientY - yOffset;
                    if (e.target === element || element.contains(e.target)) {
                        active = true; element.style.cursor = "grabbing"; element.style.zIndex = "1000";
                    }
                };
                const drag = (e) => {
                    if (!active) return;
                    e.preventDefault();
                    const clientX = e.type === "touchmove" ? e.touches[0].clientX : e.clientX;
                    const clientY = e.type === "touchmove" ? e.touches[0].clientY : e.clientY;
                    xOffset = clientX - initialX; yOffset = clientY - initialY;
                    element.style.transform = `translate3d(${xOffset}px, ${yOffset}px, 0)`;
                };
                const dragEnd = () => {
                    if (!active) return;
                    active = false; element.style.cursor = "grab"; element.style.zIndex = "10";
                    if (onDropCallback) {
                        const rect = element.getBoundingClientRect();
                        onDropCallback(rect.left + rect.width/2, rect.top + rect.height/2, element);
                    }
                };
                element.style.touchAction = "none";
                element.addEventListener("mousedown", dragStart);
                element.addEventListener("touchstart", dragStart, { passive: false });
                window.addEventListener("mousemove", drag);
                window.addEventListener("touchmove", drag, { passive: false });
                window.addEventListener("mouseup", dragEnd);
                window.addEventListener("touchend", dragEnd);
            }
        };

        const AudioEngine = {
            ctx: null,
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
            play(type) {
                this.init(); const now = this.ctx.currentTime;
                if (type === 'correct') { this.createTone(523, now, 0.4, 'sine'); this.createTone(659, now + 0.1, 0.4, 'sine'); }
                else if (type === 'wrong') this.createTone(120, now, 0.3, 'triangle', true);
                else if (type === 'click') this.createTone(800, now, 0.05, 'sine');
                else if (type === 'popup') this.createTone(400, now, 0.5, 'sine', false, 1200);
            },
            createTone(freq, time, duration, type, slideDown = false, slideUp = null) {
                const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(freq, time);
                if (slideDown) osc.frequency.exponentialRampToValueAtTime(freq * 0.5, time + duration);
                else if (slideUp) osc.frequency.exponentialRampToValueAtTime(slideUp, time + duration);
                gain.gain.setValueAtTime(0, time); gain.gain.linearRampToValueAtTime(0.15, time + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.001, time + duration);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(time); osc.stop(time + duration);
            }
        };

        const VFX = {
            canvas: null, ctx: null, particles: [],
            init() {
                this.canvas = document.getElementById('vfx-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.resize(); window.addEventListener('resize', () => this.resize());
                this.animate();
            },
            resize() { this.canvas.width = window.innerWidth; this.canvas.height = window.innerHeight; },
            confetti(x, y) {
                for (let i = 0; i < 60; i++) {
                    this.particles.push({
                        x, y, vx: (Math.random() - 0.5) * 15, vy: (Math.random() - 0.5) * 15 - 5,
                        size: Math.random() * 8 + 4, color: `hsl(${Math.random() * 360}, 70%, 60%)`, life: 1
                    });
                }
            },
            animate() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.particles.forEach((p, i) => {
                    p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.life -= 0.015;
                    this.ctx.fillStyle = p.color; this.ctx.globalAlpha = p.life;
                    this.ctx.fillRect(p.x, p.y, p.size, p.size);
                    if (p.life <= 0) this.particles.splice(i, 1);
                });
                requestAnimationFrame(() => this.animate());
            }
        };

        // Helper to convert game names into clean file names (e.g., "Distinguishing images" -> "distinguishing-images")
        function slugify(text) {
            return text
                .toString()
                .toLowerCase()
                .trim()
                .replace(/\s+/g, '-')           // Replace spaces with -
                .replace(/[^\w\-]+/g, '')       // Remove all non-word chars
                .replace(/\-\-+/g, '-');        // Replace multiple - with single -
        }

        // Safe localStorage helpers (private browsing / disabled storage won't throw)
        function saveLastGame(id) {
            try { localStorage.setItem(LAST_GAME_KEY, id); } catch (e) { /* ignore */ }
        }
        function clearLastGame() {
            try { localStorage.removeItem(LAST_GAME_KEY); } catch (e) { /* ignore */ }
        }
        function loadLastGame() {
            try { return localStorage.getItem(LAST_GAME_KEY); } catch (e) { return null; }
        }

        // --- HUB LOGIC ---
        function initSidebar() {
            const container = document.getElementById('sidebar-content');
            let globalCounter = 1;

            gameData.forEach(cat => {
                const section = document.createElement('div');
                section.className = 'category-section';
                section.innerHTML = `<span class="category-label">${cat.category}</span>`;
                
                cat.dimensions.forEach((dim, dIdx) => {
                    const dimItem = document.createElement('div');
                    dimItem.className = 'dimension-item';
                    
                    const toggle = document.createElement('button');
                    toggle.className = 'dimension-toggle';
                    toggle.innerText = dim.name;
                    toggle.onclick = () => {
                        AudioEngine.play('click');
                        document.querySelectorAll('.dimension-item').forEach(it => it !== dimItem && it.classList.remove('active'));
                        dimItem.classList.toggle('active');
                    };

                    const list = document.createElement('div');
                    list.className = 'game-list';
                    
                    dim.games.forEach((gameName, gIdx) => {
                        // Dynamically convert gameName into a friendly filename!
                        const fileSlug = slugify(gameName);
                        const path = `games/${cat.folder}/${dim.folder}/${fileSlug}.js`;
                        const gameId = `g_${cat.folder}_${dim.folder}_${fileSlug}`;
                        
                        const btn = document.createElement('button');
                        btn.className = 'game-tab';
                        btn.id = gameId;
                        btn.innerHTML = `<span>${globalCounter++}.</span> ${gameName}`;
                        
                        const gameInfo = {
                            id: gameId,
                            path,
                            title: gameName,
                            category: cat.category,
                            catFolder: cat.folder,
                            dimFolder: dim.folder,
                            dimName: dim.name
                        };
                        flatGameList.push(gameInfo);

                        btn.onclick = (e) => {
                            e.stopPropagation();
                            AudioEngine.play('click');
                            selectGame(gameInfo);
                        };
                        list.appendChild(btn);
                    });

                    dimItem.appendChild(toggle);
                    dimItem.appendChild(list);
                    section.appendChild(dimItem);
                });
                container.appendChild(section);
            });
        }

        // Builds the "choose an activity" home screen: a grid of clickable
        // cards (one per dimension) that jump straight into that activity.
        function renderLobby() {
            const stage = document.getElementById('game-stage');
            stage.innerHTML = `
                <div id="lobby-view">
                    <div class="lobby-intro">
                        <div class="lobby-emoji">🎮</div>
                        <h2>Choose Your Adventure</h2>
                        <p>Tap any activity below to jump right in, or use the sidebar.</p>
                    </div>
                </div>`;
            const lobby = document.getElementById('lobby-view');

            gameData.forEach(cat => {
                const section = document.createElement('div');
                section.className = 'lobby-category';
                section.innerHTML = `<h3 class="lobby-category-title">
                    <span>${catIcons[cat.folder] || '🎯'}</span> ${cat.category}
                </h3>`;

                const grid = document.createElement('div');
                grid.className = 'lobby-grid';

                cat.dimensions.forEach(dim => {
                    const card = document.createElement('button');
                    card.type = 'button';
                    card.className = 'lobby-card';
                    card.innerHTML = `
                        <div class="lobby-card-icon">${dimIcons[dim.name] || '🎯'}</div>
                        <div class="lobby-card-name">${dim.name}</div>
                        <div class="lobby-card-count">${dim.games.length} activities</div>
                    `;
                    card.onclick = () => {
                        AudioEngine.play('click');
                        const firstGame = flatGameList.find(g => g.catFolder === cat.folder && g.dimFolder === dim.folder);
                        if (firstGame) selectGame(firstGame);
                    };
                    grid.appendChild(card);
                });

                section.appendChild(grid);
                lobby.appendChild(section);
            });
        }

        function selectGame(gameInfo) {
            currentActiveId = gameInfo.id;
            saveLastGame(gameInfo.id);

            document.querySelectorAll('.game-tab').forEach(t => t.classList.remove('active'));
            const tabEl = document.getElementById(gameInfo.id);
            if (tabEl) tabEl.classList.add('active');

            // Make sure the matching sidebar section is expanded so the active
            // tab is visible (useful right after a refresh restores a game).
            document.querySelectorAll('.dimension-item').forEach(it => it.classList.remove('active'));
            if (tabEl) {
                const parentDim = tabEl.closest('.dimension-item');
                if (parentDim) {
                    parentDim.classList.add('active');
                    parentDim.scrollIntoView({ block: 'center' });
                }
            }

            document.getElementById('active-category').innerText = gameInfo.category;
            document.getElementById('active-title').innerText = gameInfo.title;
            document.getElementById('game-result-overlay').style.display = 'none';
            document.getElementById('game-toolbar').innerHTML = '';
            
            loadGameScript(gameInfo.path);
            if (window.innerWidth <= 900) toggleSidebar();
        }

        function loadGameScript(path) {
            const stage = document.getElementById('game-stage');
            const loader = document.getElementById('loader');
            loader.style.display = 'flex';
            stage.innerHTML = ''; 
            window.initGame = null;

            // Remove existing scripts to avoid collisions
            document.querySelectorAll('.game-script').forEach(s => s.remove());

            const script = document.createElement('script');
            script.className = 'game-script';
            script.src = path;
            script.onload = () => {
                loader.style.display = 'none';
                if (window.initGame) window.initGame('game-stage');
            };
            script.onerror = () => {
                loader.style.display = 'none';
                stage.innerHTML = `<div style="text-align:center"><h3>Activity Missing</h3><p>File not found: ${path}</p></div>`;
            };
            document.body.appendChild(script);
        }

        // --- NAVIGATION HELPERS ---
        function retryGame() {
            const game = flatGameList.find(g => g.id === currentActiveId);
            if (game) selectGame(game);
        }

        function loadNextGame() {
            const idx = flatGameList.findIndex(g => g.id === currentActiveId);
            if (idx !== -1 && idx < flatGameList.length - 1) {
                selectGame(flatGameList[idx + 1]);
            } else {
                goHome();
            }
        }

        // Goes back to the real lobby (unlike a refresh, this intentionally
        // forgets the saved position).
        function goHome() {
            clearLastGame();
            currentActiveId = null;

            document.querySelectorAll('.game-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.dimension-item').forEach(it => it.classList.remove('active'));
            document.getElementById('active-category').innerText = 'Main Lobby';
            document.getElementById('active-title').innerText = 'Welcome, Explorer!';
            document.getElementById('game-result-overlay').style.display = 'none';
            document.getElementById('game-toolbar').innerHTML = '';
            document.querySelectorAll('.game-script').forEach(s => s.remove());
            window.initGame = null;

            renderLobby();
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            setTimeout(() => VFX.resize(), 300);
        }

        window.GameHub = {
            playSound: (type) => AudioEngine.play(type),
            triggerVFX: (x, y) => VFX.confetti(x, y),
            showComplete: (title, msg) => {
                AudioEngine.play('popup');
                VFX.confetti(window.innerWidth/2, window.innerHeight/2);
                document.getElementById('result-title').innerText = title || "Success!";
                document.getElementById('result-message').innerText = msg || "Great job completing this activity.";
                
                // If it's the last game, change the "Next" button text
                const isLast = flatGameList.findIndex(g => g.id === currentActiveId) === flatGameList.length - 1;
                document.getElementById('next-game-btn').innerHTML = isLast ? "Finish 🏁" : "Next Game ➡️";
                
                document.getElementById('game-result-overlay').style.display = 'flex';
            },
            utils: GameUtils,
            addTool: (html, onClick) => {
                const btn = document.createElement('button');
                btn.className = 'game-btn secondary';
                btn.style.padding = '8px 16px';
                btn.style.fontSize = '0.8rem';
                btn.style.marginLeft = '10px';
                btn.innerHTML = html;
                btn.onclick = onClick;
                document.getElementById('game-toolbar').appendChild(btn);
            }
        };

        window.onload = () => {
            initSidebar();
            VFX.init();

            // Restore whatever activity the user was standing on (e.g. after
            // an accidental refresh). If nothing was saved, show the lobby.
            const savedId = loadLastGame();
            const savedGame = savedId ? flatGameList.find(g => g.id === savedId) : null;
            if (savedGame) {
                selectGame(savedGame);
            } else {
                renderLobby();
            }
        };
    </script>
</body>
</html>
